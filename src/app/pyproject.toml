[project]
name = "cgi.ai-langgraph-agentic-framework"
version = "0.0.1"
description = "Fast API hosted LangGraph-based agentic framework for AI applications."
readme = "README.md"
requires-python = ">=3.12,<4.0"
authors = [
    { name = "Timothy Crittenden", email = "timothy.crittenden@cgi.com" },
]
dependencies = [
    "apscheduler>=3.11.0,<4.0.0",
    "fastapi>=0.115.12,<0.116.0",
    "uvicorn>=0.34.3,<0.35.0",
    "python-multipart>=0.0.9,<0.1.0",
    "langchain==1.0.3",
    "langchain-community==0.4.1",
    "langchain-aws==1.0.0",
    "langchain-openai==1.0.2",
    "langchain_mcp_adapters==0.1.12",
    "langgraph==1.0.2",
    "langgraph-checkpoint-postgres==3.0.0",
    "boto3>=1.38.31,<2.0.0",
    "openai==2.7.1",
    "psycopg[binary]>=3.2.9,<4.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "pydantic>=2.11.5,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    "ddtrace>=3.18.0,<4.0.0",
    "structlog>=24.1.0,<25.0.0",
    "nltk==3.8.1",
    "scikit-learn>=1.7.1,<2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.13,<0.12.0",
    "rich>=13.9.4,<14.0.0",
    "colorama>=0.4.6,<0.5.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest>=8.4.1,<9.0.0",
    "sentence-transformers>=5.1.0,<6.0.0",
    "rank-bm25>=0.2.2,<0.3.0",
    "rouge-score>=0.1.2,<0.2.0",
    "pandas>=2.3.1,<3.0.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = [
    "E",
    "F4",
    "F6",
    "F7",
    "F8",
    "I",
    "B",
    "UP",
    "TID251",
]
ignore = [
    "F401",
    "F841",
]

[tool.ruff.flake8-tidy-imports.banned-api]
"logging".msg = "Use get_logger from core.logging_config for structured logging"
